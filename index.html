<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framecraft — Join our Telegram Channel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E0F11;
    --surface: #17181B;
    --surface-2: #1D1F23;
    --text: #F2F1ED;
    --text-dim: #9A9A97;
    --accent: #E3B341;
    --line: #2A2B2F;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .card{
    max-width: 480px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 48px 40px;
    text-align: center;
  }
  .badge{
    display:inline-flex; align-items:center; gap:8px;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 8px 14px;
    border-radius: 100px;
    margin-bottom: 24px;
  }
  h1{
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    line-height: 1.15;
    margin-bottom: 14px;
  }
  .sub{
    color: var(--text-dim);
    font-size: 1.02rem;
    margin-bottom: 32px;
  }
  .field{ margin-bottom: 18px; text-align: left; }
  .field label{
    display:block;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .field input{
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 13px 14px;
    border-radius: 6px;
    font-size: 1rem;
    font-family: 'Work Sans', sans-serif;
  }
  .field input:focus{ outline: none; border-color: var(--accent); }
  .btn{
    width: 100%;
    background: var(--accent);
    color: #14120A;
    border: none;
    padding: 15px 26px;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn:hover{ background: #EFC461; transform: translateY(-1px); }
  .btn:disabled{ opacity: 0.6; cursor: not-allowed; transform:none; }
  .error-msg{ color: #E38A6D; font-size: 0.88rem; margin-top: 10px; display:none; text-align:left; }
  .note{ color: var(--text-dim); font-size: 0.82rem; margin-top: 18px; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<div class="card">
  <div class="badge">Framecraft 🎬</div>
  <h1>Join our Telegram Channel</h1>
  <p class="sub">Drop your email and get instant access to the channel.</p>

  <div class="field">
    <label for="email">Your email address</label>
    <input type="email" id="email" placeholder="you@email.com" required>
  </div>

  <button class="btn" id="joinBtn" onclick="handleJoin()">Continue to Telegram</button>
  <div class="error-msg" id="errorMsg">Please enter a valid email address first.</div>
  <p class="note">You'll be redirected straight to the Telegram channel.</p>
</div>

<script>
  // ⚠️ Your Telegram invite link.
  const TELEGRAM_LINK = "https://t.me/+YazVyR6kFc5jMDRk";

  function isValidEmail(email){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  async function handleJoin(){
    const emailInput = document.getElementById('email');
    const errorMsg = document.getElementById('errorMsg');
    const email = emailInput.value.trim();

    if(!isValidEmail(email)){
      errorMsg.style.display = 'block';
      emailInput.focus();
      return;
    }
    errorMsg.style.display = 'none';

    const btn = document.getElementById('joinBtn');
    btn.disabled = true;
    btn.textContent = 'Redirecting…';

    // Quietly record the email in the background (doesn't block redirect
    // even if this fails, so nobody gets stuck).
    try {
      fetch('/api/lead', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
    } catch (err) {
      // Ignore — never block the redirect on this.
    }

    window.location.href = TELEGRAM_LINK;
  }
</script>

</body>
</html>
